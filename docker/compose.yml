# AnyGridDB and PostgreSQL. AnyGridDB serves the app and its API on one
# address, over HTTPS only: https://localhost:3000. Without a certificate of
# the operator's, it makes its own authority on the `tls` volume (ADR 0029).
# Files live on the `files` volume. PostgreSQL is reachable from AnyGridDB
# alone, on the stack's own network, and over TLS only: the one-shot `certs`
# service issues its certificate from the instance's internal authority
# before it starts (ADR 0030).
#
#   cp .env.example .env
#   docker compose up -d --build
#
# To run AnyGridDB on the host against this PostgreSQL (development):
#
#   docker compose -f compose.yml -f compose.dev.yml up -d db
#
# On a PostgreSQL of your own (managed): compose.managed.yml alone. From a
# PostgreSQL 17 stack: scripts/upgrade-postgres.sh. Backups:
# scripts/backup.sh and scripts/restore.sh. See docs/operations.md.
#
# Behind a reverse proxy on the same host (HTTPS on loopback only):
#
#   docker compose -f compose.yml -f compose.proxy.yml up -d
#
# To keep files in an S3-compatible store instead, add the RustFS overlay:
#
#   docker compose -f compose.yml -f compose.s3.yml up -d --build

name: anygriddb

x-anygriddb-image: &anygriddb-image
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      ANYGRIDDB_VERSION: ${ANYGRIDDB_VERSION:-}
      ANYGRIDDB_COMMIT: ${ANYGRIDDB_COMMIT:-}
      ANYGRIDDB_CREATED: ${ANYGRIDDB_CREATED:-}
  image: anygriddb:local

# A container's log is kept to three files of 10 MB, so that a process
# that says much cannot fill the host's disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot, before the services it serves: certificates for the stack's
  # services from the instance's internal authority (keys owned by each
  # service's user), and the authority AnyGridDB trusts them by. It runs
  # as root only to give each key to its service, with no network.
  certs:
    <<: *anygriddb-image
    user: "0:0"
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    # Root, with what it takes to give each key to its service and to read
    # the authority, which is the application's own (mode 0700), and
    # nothing more.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging
    command:
      [
        "anygriddb",
        "tls",
        "services",
        "--out",
        "/certs",
        "--postgres",
        "db:999:999",
      ]
    environment:
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY in docker/.env, or run scripts/compose.sh}
      AUTH_ENCRYPTION_PREVIOUS_KEYS: ${AUTH_ENCRYPTION_PREVIOUS_KEYS:-}
    volumes:
      - tls_data:/data/tls
      - service_certs:/certs

  # One-shot, before PostgreSQL: a stack that ran PostgreSQL 17 keeps its
  # data in `postgres_data`, which PostgreSQL 18 does not open. Rather than
  # start on an empty database, it stops and says how to move the data:
  # scripts/upgrade-postgres.sh, which alone lets it through.
  postgres-upgrade-check:
    image: postgres:18
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A cluster's folder opens to its own account alone: to read the two
    # files that say what the volumes hold, the check keeps the one
    # capability that reads past that, and no other.
    cap_add:
      - DAC_READ_SEARCH
    logging: *default-logging
    environment:
      ANYGRIDDB_PG_UPGRADE: ${ANYGRIDDB_PG_UPGRADE:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /old/PG_VERSION ] && [ ! -f /new/18/docker/PG_VERSION ] && [ -z "$$ANYGRIDDB_PG_UPGRADE" ]; then
          echo "This stack's data is in PostgreSQL $$(cat /old/PG_VERSION) format (volume postgres_data)." >&2
          echo "Move it to PostgreSQL 18 first: scripts/upgrade-postgres.sh (docs/operations.md)." >&2
          exit 1
        fi
    volumes:
      - postgres_data:/old:ro
      - postgres_18:/new:ro

  db:
    image: postgres:18
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Docker's 64mb is too small for a parallel query's shared memory.
    shm_size: 256mb
    logging: *default-logging
    environment:
      # The cluster's first role is `postgres`, the image's own: PostgreSQL
      # keeps it a superuser whatever is asked. AnyGridDB signs in as
      # POSTGRES_USER, a role made beside it with no such power (ADR 0003).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env, or run scripts/compose.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in docker/.env}
      ANYGRIDDB_DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
    # Before PostgreSQL starts, the step that makes AnyGridDB's role is put
    # where the image runs it: once, on an empty volume, never on a
    # database that exists. It is written here rather than mounted from a
    # file, so that this file alone installs a release. A volume made
    # before this keeps POSTGRES_USER as its first role, a superuser:
    # docs/operations.md says how to check, and how to change it.
    entrypoint:
      - sh
      - -c
      - |
        cat > /docker-entrypoint-initdb.d/10-application-role.sh <<'ROLE'
        #!/bin/sh
        set -eu
        psql -v ON_ERROR_STOP=1 --username postgres --dbname "$$POSTGRES_DB" \
          --set=role="$$ANYGRIDDB_DB_USER" --set=pass="$$POSTGRES_PASSWORD" \
          --set=db="$$POSTGRES_DB" <<'SQL'
        SELECT NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') AS absent \gset
        \if :absent
          CREATE ROLE :"role" LOGIN PASSWORD :'pass'
            NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS CREATEDB;
        \endif
        ALTER DATABASE :"db" OWNER TO :"role";
        ALTER SCHEMA public OWNER TO :"role";
        SQL
        ROLE
        chmod +x /docker-entrypoint-initdb.d/10-application-role.sh
        # An overlay that gives no command (development, the journeys)
        # starts PostgreSQL as the image does.
        if [ "$$#" -eq 0 ]; then set -- postgres; fi
        exec docker-entrypoint.sh "$$@"
      - --
    # TLS only over the network (pg_hba.conf from `certs`); the socket
    # inside the container stays for the image's own setup and checks.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/db/db_cert.pem
      - -c
      - ssl_key_file=/certs/db/db_key.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/certs/db/pg_hba.conf
      # A slow statement, a lock wait, a temp file, a checkpoint, and a
      # vacuum are logged. Bind parameters are not: a cell value must
      # not land in the container log.
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_temp_files=0
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - log_parameter_max_length=0
    # PostgreSQL 18 keeps its cluster in /var/lib/postgresql/18/docker.
    volumes:
      - postgres_18:/var/lib/postgresql
      - service_certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres-upgrade-check:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$$ANYGRIDDB_DB_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    <<: *anygriddb-image
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Nothing is written to the image: what the instance keeps is on its
    # volumes, and /tmp is one too (below).
    read_only: true
    cap_drop:
      - ALL
    logging: *default-logging
    environment:
      # Verified TLS to PostgreSQL, by the internal authority (ADR 0030).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/certs/internal-authority.crt
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY in docker/.env, or run scripts/compose.sh}
      AUTH_ENCRYPTION_PREVIOUS_KEYS: ${AUTH_ENCRYPTION_PREVIOUS_KEYS:-}
      PORT: "4000"
      # Canonical HTTPS origin people open: links, cookies, passkeys (RP ID),
      # and the certificate's primary name. Use a hostname for passkeys; an
      # IP alone keeps HTTPS and TOTP (ADR 0029).
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:3000}
      # Extra certificate SANs only (IPs, aliases). Not the WebAuthn RP ID.
      TLS_NAMES: ${TLS_NAMES:-}
      # The operator's own certificate, mounted below; empty: the instance's.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ANYGRIDDB_TRUSTED_PROXIES: ${ANYGRIDDB_TRUSTED_PROXIES:-}
      ANYGRIDDB_SOURCES_ALLOWED_HOSTS: ${ANYGRIDDB_SOURCES_ALLOWED_HOSTS:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      # Connections requests share (10 by default); see docs/operations.md.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      # Uploads read at once (8 by default); see docs/operations.md.
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-}
      # Imports, exports, and snapshots run at once (2 by default).
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-}
      # Event, webhook, and automation workers at once (4 by default).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      # Most rows one export writes (1,000,000 by default).
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-}
      # Metrics and traces, off unless set (ADR 0018).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      # Sign-in events to a syslog collector over TLS, off unless a host
      # is named (ADR 0084). A certificate authority of your own is a
      # file you mount, named by SYSLOG_CA_FILE.
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-}
      SYSLOG_CA_FILE: ${SYSLOG_CA_FILE:-}
      # Files in an object store of your own, in place of the `files`
      # volume (compose.s3.yml sets these for the store it runs).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
    volumes:
      - files_data:/data/files
      - tls_data:/data/tls
      - service_certs:/certs:ro
      # What comes in or goes out (an upload, an import, an export, a
      # snapshot) is written whole to /tmp on its way: on disk, never in
      # memory, in a volume that goes with the container.
      - /tmp
      # The operator's certificate, if any: set TLS_CERT_FILE and
      # TLS_KEY_FILE to /own-tls/... and mount its folder here.
      # - ./own-tls:/own-tls:ro
    ports:
      - "3000:4000"
    depends_on:
      certs:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "anygriddb", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

networks:
  # Dedicated network. `internal: true` would block published ports, so the host
  # could not reach Postgres or AnyGridDB.
  internal: {}

volumes:
  # PostgreSQL 17's data, kept after an upgrade until the operator drops it.
  postgres_data:
  postgres_18:
  files_data:
  tls_data:
  service_certs:
