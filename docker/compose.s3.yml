# Files in an S3-compatible store instead of the `files` volume. RustFS
# (Apache-2.0) runs next to the API; any other S3 service works the same
# way with STORAGE_DRIVER=s3 and the S3_* variables.
#
#   docker compose -f compose.yml -f compose.s3.yml up -d --build
#
# An instance that kept its files on the volume copies them first, then
# once more after the switch for what was written meanwhile:
#
#   docker compose -f compose.yml -f compose.s3.yml run --rm app \
#     anygriddb storage migrate --from disk --to s3
#
# The bucket belongs to this instance alone: the daily sweep deletes the
# files no row of this instance names.
#
# RustFS serves HTTPS with a certificate from the instance's internal
# authority, on the stack's network only (ADR 0030).
services:
  certs:
    command:
      [
        "anygriddb",
        "tls",
        "services",
        "--out",
        "/certs",
        "--postgres",
        "db:999:999",
        "--service",
        "rustfs:10001:10001",
      ]

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in docker/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in docker/.env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      RUSTFS_TLS_PATH: /certs/rustfs
    volumes:
      - rustfs_data:/data
      - service_certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--cacert",
          "/certs/internal-authority.crt",
          "--resolve",
          "rustfs:9000:127.0.0.1",
          "https://rustfs:9000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  app:
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: https://rustfs:9000
      # The S3 client trusts the internal authority, for RustFS alone.
      NODE_EXTRA_CA_CERTS: /certs/internal-authority.crt
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-attachments}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs_data:
