# AnyGridDB on a PostgreSQL of your own: a managed service, or a server
# you run elsewhere (docs/operations.md). No PostgreSQL in this stack.
#
# Its address must verify the server's certificate, as every connection
# AnyGridDB opens does (ADR 0030). In docker/.env:
#
#   DATABASE_URL=postgres://anygriddb:…@pg.example.net:5432/anygriddb?sslmode=verify-full
#
# For an authority your system does not trust (most managed services give
# theirs), put it in docker/managed-ca/ca.pem and end the address with
# &sslrootcert=/managed-ca/ca.pem.
#
#   docker compose -f compose.managed.yml up -d --build

name: anygriddb

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ANYGRIDDB_VERSION: ${ANYGRIDDB_VERSION:-}
        ANYGRIDDB_COMMIT: ${ANYGRIDDB_COMMIT:-}
        ANYGRIDDB_CREATED: ${ANYGRIDDB_CREATED:-}
    image: anygriddb:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in docker/.env}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY in docker/.env}
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:3000}
      TLS_NAMES: ${TLS_NAMES:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ANYGRIDDB_SOURCES_ALLOWED_HOSTS: ${ANYGRIDDB_SOURCES_ALLOWED_HOSTS:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - files_data:/data/files
      - tls_data:/data/tls
      - ./managed-ca:/managed-ca:ro
    ports:
      - "3000:4000"
    healthcheck:
      test: ["CMD", "anygriddb", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  files_data:
  tls_data:
