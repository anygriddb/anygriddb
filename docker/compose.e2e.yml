# PostgreSQL for the Playwright run, as the image starts it, published on
# the loopback only: the browser tests' server runs on this machine.
services:
  db:
    command: !reset []
    depends_on: !reset {}
    ports: !override
      - "127.0.0.1:5433:5432"

  # A mail catcher on the loopback: a sign-up proves its address by the
  # link it mails (ADR 0058), and the journeys read that mail here. SMTP on
  # 1026, its API on 8026, beside a developer's own ports.
  mail:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
