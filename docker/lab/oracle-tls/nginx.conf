# TCPS front for the lab Oracle listener (ADR 0047). AnyGridDB reaches
# Oracle over verified TLS; sqlplus seed scripts still use TCP :1521.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

stream {
  server {
    listen 2484 ssl;
    proxy_pass oracle:1521;
    proxy_connect_timeout 10s;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
  }
}
