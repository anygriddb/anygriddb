# TLS front for the lab OpenSearch (ADR 0088). AnyGridDB reaches it over
# verified TLS with the lab's certificate; the cluster's own HTTP stays
# inside, with its accounts on, and the seed signs in through this front.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

stream {
  server {
    listen 9243 ssl;
    proxy_pass opensearch:9200;
    proxy_connect_timeout 10s;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
  }
}
