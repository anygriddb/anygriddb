# TLS front for the lab's Valkey, Cassandra and Neo4j (ADR 0088).
# AnyGridDB reaches them over verified TLS with the lab's certificate.
# Each store's own port stays inside the lab's network, without TLS.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

stream {
  server {
    listen 6379 ssl;
    proxy_pass valkey:6379;
    proxy_connect_timeout 10s;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
  }

  server {
    listen 9042 ssl;
    proxy_pass cassandra:9042;
    proxy_connect_timeout 10s;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
  }

  server {
    listen 7687 ssl;
    proxy_pass neo4j:7687;
    proxy_connect_timeout 10s;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
  }
}
