# AnyGridDB sample-database lab (opt-in). Not part of the official product
# stack. Engines speak TLS with the lab CA in ./certs (scripts/lab/gen-certs.sh).
# SQL Server is profile `mssql` only; Oracle Free is profile `oracle` only
# (OPEN_SOURCE_POLICY.md — interoperability images, never the default stack).
# Profile `stores` starts the stores that speak no SQL, which AnyGridDB reads
# from a copy (ADR 0088): FerretDB (the MongoDB wire protocol), OpenSearch,
# Valkey (the Redis wire protocol), Cassandra, and Neo4j Community.
#
#   ./scripts/lab/up.sh --mssql --oracle --stores
#   ./scripts/lab/seed.sh --all
#   ./scripts/lab/seed.sh --stores

name: anygriddb-lab

services:
  pg:
    image: postgres:17
    container_name: aglab-pg
    environment:
      POSTGRES_PASSWORD: ${LAB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aglab-pg-data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: aglab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_PASSWORD}
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - aglab-mysql-data:/var/lib/mysql
      - ./certs:/certs:ro
    command:
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      - --ssl-ca=/certs/ca.crt
      - --require-secure-transport=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${LAB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.4
    container_name: aglab-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB_PASSWORD}
    ports:
      - "127.0.0.1:53307:3306"
    volumes:
      - aglab-mariadb-data:/var/lib/mysql
      - ./certs:/certs:ro
    command:
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
      - --ssl-ca=/certs/ca.crt
      - --require-secure-transport=ON
      - --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aglab-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${LAB_PASSWORD}
      MSSQL_PID: Developer
      # 1500 MB cannot restore WideWorldImporters: 2500 holds one large
      # sample at a time.
      MSSQL_MEMORY_LIMIT_MB: "2500"
    ports:
      - "127.0.0.1:51433:1433"
    volumes:
      - aglab-mssql-data:/var/opt/mssql
      - aglab-mssql-backup:/var/opt/mssql/backup
      - ./certs:/certs:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cp /certs/server.crt /certs/server.key /var/opt/mssql/ &&
        chmod 600 /var/opt/mssql/server.key &&
        printf '[network]\ntlscert = /var/opt/mssql/server.crt\ntlskey = /var/opt/mssql/server.key\ntlsprotocols = 1.2\nforceencryption = 1\n[memory]\nmemorylimitmb = 2500\n' > /var/opt/mssql/mssql.conf &&
        exec /opt/mssql/bin/sqlservr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Oracle Free 23ai (gvenzl): TCP for seed/sqlplus, TCPS via oracle-tls for
  # AnyGridDB (thin oracledb, ADR 0047). Profile `oracle` only.
  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: aglab-oracle
    environment:
      ORACLE_PASSWORD: ${LAB_PASSWORD}
    ports:
      - "127.0.0.1:51521:1521"
    volumes:
      - aglab-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 120s

  oracle-tls:
    profiles: ["oracle"]
    image: nginx:1.30-alpine
    container_name: aglab-oracle-tls
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "127.0.0.1:52484:2484"
    volumes:
      - ./certs:/certs:ro
      - ./oracle-tls/nginx.conf:/etc/nginx/nginx.conf:ro

  # FerretDB keeps its documents in a PostgreSQL with the DocumentDB
  # extension (MIT); FerretDB itself is Apache-2.0.
  ferretdb-pg:
    profiles: ["stores"]
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: aglab-ferretdb-pg
    environment:
      # The extension's scheduler works in the database `postgres` only.
      POSTGRES_USER: ferretdb
      POSTGRES_PASSWORD: ${LAB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - aglab-ferretdb-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferretdb -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  ferretdb:
    profiles: ["stores"]
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: aglab-ferretdb
    # The lab's key is readable by its owner alone, and this image has no
    # shell to copy it with: root reads it where it is.
    user: "0:0"
    depends_on:
      ferretdb-pg:
        condition: service_healthy
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://ferretdb:${LAB_PASSWORD}@ferretdb-pg:5432/postgres
      # TLS on the published port; the listener in clear stays inside.
      FERRETDB_LISTEN_ADDR: 127.0.0.1:27017
      FERRETDB_LISTEN_TLS: 0.0.0.0:27018
      FERRETDB_LISTEN_TLS_CERT_FILE: /certs/server.crt
      FERRETDB_LISTEN_TLS_KEY_FILE: /certs/server.key
      FERRETDB_TELEMETRY: disable
    ports:
      - "127.0.0.1:57017:27018"
    volumes:
      - ./certs:/certs:ro

  # OpenSearch (Apache-2.0) with its accounts on. Its HTTP stays inside the
  # lab's network; the front below serves it over TLS.
  opensearch:
    profiles: ["stores"]
    image: opensearchproject/opensearch:2.19.7
    container_name: aglab-opensearch
    environment:
      discovery.type: single-node
      # The cluster refuses a password like its admin's name, which the
      # lab's own is: this one is the cluster administrator's alone. The
      # account AnyGridDB reads with keeps LAB_PASSWORD.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${LAB_OPENSEARCH_ADMIN_PASSWORD:-Harbor-Ledger-Kiwi-58!}
      # The transport keeps the image's own certificates; HTTP is served
      # in clear inside, behind the front.
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - aglab-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD http://127.0.0.1:9200/ >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  opensearch-tls:
    profiles: ["stores"]
    image: nginx:1.30-alpine
    container_name: aglab-opensearch-tls
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:59243:9243"
    volumes:
      - ./certs:/certs:ro
      - ./opensearch-tls/nginx.conf:/etc/nginx/nginx.conf:ro

  # Valkey (BSD-3-Clause) speaks the Redis wire protocol. Its own port
  # stays inside; the front below serves it over TLS. Redis's server is
  # not used: its license is not one this lab takes.
  valkey:
    profiles: ["stores"]
    image: valkey/valkey:8.1.4
    container_name: aglab-valkey
    environment:
      LAB_PASSWORD: ${LAB_PASSWORD}
    command:
      - valkey-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --requirepass
      - ${LAB_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - aglab-valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$$LAB_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cassandra (Apache-2.0). Authentication is off, as the image ships:
  # the connector reads it when the server says nothing about roles.
  cassandra:
    profiles: ["stores"]
    image: cassandra:5.0
    container_name: aglab-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      # The volume kept from the lab's first start is named this. A new
      # name makes Cassandra refuse to open it.
      CASSANDRA_CLUSTER_NAME: anygriddb-lab
    volumes:
      - aglab-cassandra-data:/var/lib/cassandra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  # Neo4j Community (GPL-3.0). The bolt port stays inside; the front
  # serves it over TLS. The built-in account is the one the seed uses
  # to load data, and the one AnyGridDB refuses.
  neo4j:
    profiles: ["stores"]
    image: neo4j:5.26-community
    container_name: aglab-neo4j
    environment:
      NEO4J_AUTH: neo4j/${LAB_PASSWORD}
      LAB_PASSWORD: ${LAB_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_bolt_tls__level: DISABLED
    volumes:
      - aglab-neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p "$$LAB_PASSWORD" ''RETURN 1'' >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  stores-tls:
    profiles: ["stores"]
    image: nginx:1.30-alpine
    container_name: aglab-stores-tls
    depends_on:
      valkey:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:56379:6379"
      - "127.0.0.1:59042:9042"
      - "127.0.0.1:57687:7687"
    volumes:
      - ./certs:/certs:ro
      - ./stores-tls/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  aglab-pg-data:
  aglab-mysql-data:
  aglab-mariadb-data:
  aglab-mssql-data:
  aglab-mssql-backup:
  aglab-oracle-data:
  aglab-ferretdb-pg-data:
  aglab-opensearch-data:
  aglab-valkey-data:
  aglab-cassandra-data:
  aglab-neo4j-data:
