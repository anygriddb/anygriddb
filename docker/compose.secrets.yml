# Overlay for scripts/install.sh: Postgres password and encryption key
# (and the app's DATABASE_URL) come from Docker secrets, not from .env.
#
#   ../scripts/install.sh
#   ../scripts/compose.sh up -d
#
# Requires docker/secrets/{postgres_password,auth_encryption_key,database_url}.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  auth_encryption_key:
    file: ./secrets/auth_encryption_key
  database_url:
    file: ./secrets/database_url

services:
  certs:
    environment:
      AUTH_ENCRYPTION_KEY: ""
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
    secrets:
      - auth_encryption_key

  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  app:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_ENCRYPTION_KEY: ""
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
    secrets:
      - auth_encryption_key
      - database_url
