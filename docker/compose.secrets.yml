# The two secrets compose.yml needs, from files instead of .env, for the
# database this stack runs (docs/operations.md, Secrets from files). Made
# by scripts/install.sh; given, with compose.yml, by scripts/compose.sh,
# which reads the files so compose.yml can be filled in. Here the files
# are mounted and the variables are left empty in the containers.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  auth_encryption_key:
    file: ./secrets/auth_encryption_key
  database_url:
    file: ./secrets/database_url

services:
  certs:
    environment:
      AUTH_ENCRYPTION_KEY: ""
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
    secrets:
      - auth_encryption_key

  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  # The address of the role that owns the tables goes to these two alone.
  prepare:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url

  indexes:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url

  app:
    environment:
      AUTH_ENCRYPTION_KEY: ""
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
    secrets:
      - auth_encryption_key
