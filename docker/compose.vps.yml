# Isolated VPS constraint harness. Always use project name anygriddb-vps:
#
#   scripts/vps/up.sh <entry|balanced|credits>
#
# Or by hand, with the limits of a profile of scripts/vps/common.sh (the
# only place profiles are defined), from the repository root:
#
#   (source scripts/vps/common.sh && VPS_PROFILE=entry compose up -d --build)
#
# Publishes https://127.0.0.1:3100. Never share volumes with the developer
# stack (project anygriddb on :3000). Env file: docker/.env.vps (scripts/vps/up.sh).
# CPU/RAM envelopes: VPS_{APP,DB}_{CPUS,MEM,MEMSWAP}, from profile_settings.
# Optional Compose profile `noisy` starts a stress-ng neighbor.

name: anygriddb-vps

x-anygriddb-vps-image: &anygriddb-vps-image
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      ANYGRIDDB_VERSION: ${ANYGRIDDB_VERSION:-}
      ANYGRIDDB_COMMIT: ${ANYGRIDDB_COMMIT:-}
      ANYGRIDDB_CREATED: ${ANYGRIDDB_CREATED:-}
  image: anygriddb:vps

services:
  certs:
    <<: *anygriddb-vps-image

  app:
    <<: *anygriddb-vps-image
    ports: !override
      - "127.0.0.1:3100:4000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:3100}
    cpus: ${VPS_APP_CPUS:?set VPS_APP_CPUS (scripts/vps/up.sh)}
    mem_limit: ${VPS_APP_MEM:?set VPS_APP_MEM (scripts/vps/up.sh)}
    memswap_limit: ${VPS_APP_MEMSWAP:?set VPS_APP_MEMSWAP (scripts/vps/up.sh)}
    mem_swappiness: 0
    # Constrained vCPU profiles (especially credits) make `anygriddb health`
    # exceed the stock 5s timeout even when the process is fine.
    healthcheck:
      test: ["CMD", "anygriddb", "health"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 90s

  db:
    cpus: ${VPS_DB_CPUS:?set VPS_DB_CPUS (scripts/vps/up.sh)}
    mem_limit: ${VPS_DB_MEM:?set VPS_DB_MEM (scripts/vps/up.sh)}
    memswap_limit: ${VPS_DB_MEMSWAP:?set VPS_DB_MEMSWAP (scripts/vps/up.sh)}
    mem_swappiness: 0

  # Optional noisy neighbor: burns host CPU outside the app/db cgroups.
  neighbor:
    profiles: ["noisy"]
    image: alpine:3.21
    restart: "no"
    security_opt:
      - no-new-privileges:true
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache stress-ng >/dev/null && exec stress-ng --cpu 0 --timeout 0
