# Publish a release image when a version tag is pushed (ADR 0048).
# The annotated tag's message is the operator release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anygriddb/anygriddb

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          root="$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ "$version" != "$root" ]; then
            echo "tag v$version does not match package.json version $root" >&2
            exit 1
          fi
          # Only what main holds was reviewed and checked (the ruleset).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $tag is not on main: release a commit of main" >&2
            exit 1
          fi
          major_minor="$(printf '%s' "$version" | cut -d. -f1-2)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major_minor=$major_minor"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            ANYGRIDDB_VERSION=${{ steps.version.outputs.version }}
            ANYGRIDDB_COMMIT=${{ github.sha }}
            ANYGRIDDB_CREATED=${{ steps.version.outputs.created }}
          labels: |
            org.opencontainers.image.title=AnyGridDB
            org.opencontainers.image.description=Open-source spreadsheet interface on real SQL tables
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.url=https://github.com/anygriddb/anygriddb
            org.opencontainers.image.source=https://github.com/anygriddb/anygriddb
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          provenance: false

      - name: Digest and pin file
        id: pin
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "missing image digest from build" >&2
              exit 1
              ;;
          esac
          version="${{ steps.version.outputs.version }}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}"
          {
            echo "# AnyGridDB ${version}, written by the Release workflow (ADR 0048)."
            echo "# docker compose -f compose.yml -f compose.release.yml --env-file .env --env-file image-pin.env up -d"
            echo "ANYGRIDDB_VERSION=${version}"
            echo "ANYGRIDDB_IMAGE=${image}"
            echo "ANYGRIDDB_DIGEST=${digest}"
          } > "$RUNNER_TEMP/image-pin.env"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Release notes from annotated tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # Checkout may leave the tag lightweight: fetch the annotated one.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          body="$(git tag -l --format='%(contents)' "$tag")"
          {
            if [ -n "$body" ]; then
              printf '%s\n\n---\n\n' "$body"
            else
              printf 'AnyGridDB %s\n\n' "${{ steps.version.outputs.version }}"
            fi
            printf 'Image: `%s@%s`\n' \
              "${{ steps.pin.outputs.image }}" \
              "${{ steps.pin.outputs.digest }}"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/image-pin.env" --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" "$RUNNER_TEMP/image-pin.env" \
              --title "AnyGridDB ${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
