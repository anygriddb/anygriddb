name: Commits

on:
  pull_request:
    # edited: a corrected title is checked again.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # reads the pull request's commits: write nothing

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Squash merging makes the title the commit's header on main.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          sh scripts/validate-conventional-commit.sh "$RUNNER_TEMP/pr-title"

      - name: Conventional Commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" > /tmp/commits.json
          python3 - << 'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          raw = pathlib.Path("/tmp/commits.json").read_text().strip()
          commits = []
          if raw:
              decoder = json.JSONDecoder()
              idx = 0
              while idx < len(raw):
                  while idx < len(raw) and raw[idx].isspace():
                      idx += 1
                  if idx >= len(raw):
                      break
                  obj, end = decoder.raw_decode(raw, idx)
                  commits.extend(obj if isinstance(obj, list) else [obj])
                  idx = end

          if not commits:
              print("::error::No commits found on the pull request")
              sys.exit(1)

          script = "scripts/validate-conventional-commit.sh"
          failed = False
          for commit in commits:
              sha = commit["sha"]
              # Dependabot writes its own messages.
              if (commit.get("author") or {}).get("type") == "Bot":
                  print(f"Skipping bot commit {sha}")
                  continue
              message = commit["commit"]["message"]
              path = pathlib.Path("/tmp/commit-msg")
              path.write_text(message if message.endswith("\n") else message + "\n")
              result = subprocess.run(["sh", script, str(path)])
              if result.returncode != 0:
                  print(f"::error::Commit {sha} is not a Conventional Commit")
                  failed = True

          sys.exit(1 if failed else 0)
          PY
