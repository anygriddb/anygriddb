packages:
  - "apps/*"
  - "packages/*"

# Only these packages may run install scripts (native builds). The others
# come with Testcontainers and work without their optional native parts;
# oracledb's only checks thick mode, which AnyGridDB does not use.
allowBuilds:
  esbuild: true
  sharp: true
  cpu-features: false
  oracledb: false
  protobufjs: false
  ssh2: false

engineStrict: true

# `pnpm add` pins the exact version (CONTRIBUTING.md); no ^ or ~ ranges.
savePrefix: ""

# A version published less than seven days ago is not installed: most
# compromised releases are caught and pulled within that window. Minutes.
minimumReleaseAge: 10080

# Versions under a moderate advisory, wherever they come from, are lifted
# to the first fixed line, whose API is the same:
# - glob 9 to 14.0.1 (GHSA-3g3m-2fjr-6pw4), asked by @fastify/static and,
#   through testcontainers, archiver-utils 5;
# - minimatch 7 to 11.0.0 (GHSA-g3hv-75wg-m249), asked by those globs and
#   the lint tooling;
# - uuid 8 asked by exceljs; 11 keeps `v4`.
# Older lines outside the advisories (glob 7, minimatch 3 and 5) stay.
overrides:
  "glob@>=9.0.0 <14.0.2": "14.0.3"
  "minimatch@>=7.0.0 <11.0.1": "11.0.4"
  "exceljs>uuid": "11.1.1"

# exceljs reads an XLSX import as a stream: unzipper ends it before the last
# parts are read when a sheet is parked in a temporary file first, and the
# import failed or lost its shared strings (import-file.test.ts).
patchedDependencies:
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
